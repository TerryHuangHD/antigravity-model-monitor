<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src {{cspSource}}; script-src 'nonce-{{nonce}}'; img-src {{cspSource}} data:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Subscription Usage Monitor</title>
  <link rel="stylesheet" href="{{cssUri}}" />
</head>

<body>
  <header class="app-header">
    <div class="header-title">
      <p class="eyebrow">LOCAL USAGE OVERVIEW</p>
      <h1>AI Subscription Usage</h1>
      <p class="subtitle" id="subtitle">Loading…</p>
    </div>
    <div class="header-actions">
      <label class="refresh-interval-control" for="refresh-interval">
        <span>Every</span>
        <input type="number" id="refresh-interval" class="refresh-interval-input" min="10" max="3600"
          step="10" aria-label="Refresh interval in seconds" />
        <span>s</span>
      </label>
      <button id="refresh-btn" type="button" class="button-primary">Refresh all</button>
    </div>
  </header>

  <main class="dashboard-shell">
    <section class="section-block">
      <div class="section-heading">
        <div>
          <p class="section-kicker">SUBSCRIPTIONS</p>
          <h2>Usage sources</h2>
        </div>
        <p>Drag subscriptions and quota rows to control status-bar order. Every name and visibility switch is saved.</p>
      </div>
      <div class="subscription-stack" id="subscriptions">
        <div class="empty">Waiting for subscription usage…</div>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <button id="reset-all" type="button" class="link-button">Reset all subscription customizations</button>
  </footer>

  <script nonce="{{nonce}}" src="{{jsUri}}"></script>
</body>

</html>
